{{- $server := .Values.server -}}
{{- $telemetry := .Values.telemetry -}}
{{- $tracingUrl := include "ts-server-boilerplate.tracingUrl" . -}}
{{- $opentelemetryLoggingUrl := include "ts-server-boilerplate.opentelemetryLoggingUrl" . -}}
{{- if .Values.enabled -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ts-server-boilerplate.fullname" . }}
data:
  {{- with $server }}
  REQUEST_PAYLOAD_LIMIT: {{ .requestPayloadLimit | quote }}
  RESPONSE_COMPRESSION_ENABLED: {{ .responseCompressionEnabled | quote }}
  {{- end }}
  {{- with $telemetry }}
  LOG_LEVEL: {{ .logger.level | quote }}
  LOG_PRETTY_PRINT_ENABLED: {{ .logger.prettyPrint | quote }}
  {{- with .logger.opentelemetryOptions }}
  {{- if .enabled }}
  OPENTELEMETRY_LOGGING_ENABLED: 'true'
  OTLP_LOGGER_ENDPOINT_URL: {{ $opentelemetryLoggingUrl | quote }}
  {{- if .resourceAttributes }}
  OTEL_RESOURCE_ATTRIBUTES: {{ include "ts-server-boilerplate.otelResourceAttributes" .resourceAttributes | quote }}
  {{- end }}
  {{- end }}
  {{- end }}
  {{- if .tracing.enabled }}
  TELEMETRY_TRACING_ENABLED: 'true'
  TELEMETRY_TRACING_URL: {{ $tracingUrl | quote }}
  {{- end }}
  {{- end }}
  npm_config_cache: /tmp/
  {{- with .Values.externalServices }}
  CATALOG_URL: {{ .catalog | quote }}
  EXTRACTABLE_URL: {{ .extractable | quote }}
  {{- with .lookupTables }}
  LOOKUP_TABLES_URL: {{ .url | quote }}
  LOOKUP_TABLES_SUB_URL: {{ .subUrl | quote }}
  {{- end }}
  {{- end }}
  {{- with .Values.jobManager }}
  JOB_MANAGER_URL: {{ .url | quote }}
  JOB_INGESTION_TYPE: {{ .ingestion.jobType | quote }}
  TASK_INGESTION_TYPE: {{ .ingestion.taskType | quote }}
  INGESTION_TASK_BATCHES: {{ .ingestion.batches | quote }}
  JOB_DELETE_TYPE: {{ .delete.jobType | quote }}
  TASK_DELETE_TYPE: {{ .delete.taskType | quote }}
  {{- end }}
  VALIDATION_PERCENTAGE_LIMIT: {{ .Values.validation.percentageLimit | quote }}
  VALIDATION_BASE_PATH: {{ .Values.validation.basePath | quote }}
  PROVIDER_FROM: {{ .Values.provider | quote }}
  {{- if eq .Values.provider "NFS" }}
  PV_SOURCE_PATH: {{ .Values.NFS.pvPath | quote }}
  {{- end }}
  {{- if eq .Values.provider "S3" }}
  {{- with .Values.S3 }}
  S3_ENDPOINT_URL: {{ .endpointUrl | quote }}
  S3_BUCKET: {{ .bucket | quote }}
  S3_REGION: {{ .region | quote }}
  S3_FORCE_PATH_STYLE: {{ .forcePathStyle | quote }}
  S3_SSL_ENABLED: {{ .sslEnabled | quote }}
  S3_MAX_ATTEMPTS: {{ .maxAttempts | quote }}
  {{- end }}
  {{- end }}
  {{- with .Values.configManagement }}
  CONFIG_NAME: {{ .name | quote }}
  CONFIG_VERSION: {{ .version | quote }}
  CONFIG_OFFLINE_MODE: {{ .offlineMode | quote }}
  CONFIG_SERVER_URL: {{ .serverUrl | quote }}
  {{- end -}}
{{- end }}
