{{- $releaseName := .Release.Name -}}
{{- $chartName := include "3d-ops-trigger.name" . -}}
{{- $cloudProviderFlavor := include "3d-ops-trigger.cloudProviderFlavor" . -}}
{{- $server := .Values.server -}}
{{- if .Values.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "3d-ops-trigger.fullname" . }}
  labels:
    app: {{ $chartName }}
    component: {{ $chartName }}
    release: {{ $releaseName }}
    {{- include "3d-ops-trigger.labels" . | nindent 4 }}
spec:
  {{- if eq $cloudProviderFlavor "minikube" }}
  type: NodePort
  {{- end }}
  ports:
    - port: {{ $server.port }}
      targetPort: {{ $server.targetPort }}
      protocol: {{ $server.protocol }}
      name: http
      {{- if eq $cloudProviderFlavor "minikube" }}
      nodePort: {{ .Values.nodePort }}
      {{- end }}
  selector:
    app: {{ $chartName }}
    release: {{ $releaseName }}
    run: {{ include "3d-ops-trigger.fullname" . }}
    {{- include "3d-ops-trigger.selectorLabels" . | nindent 4 }}
{{- end }}
