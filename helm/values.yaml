global:
  cloudProvider: {}
  NFS: {}
  telemetry:
    tracing: {}
    logger:
      opentelemetryOptions: {}

mclabels:
  component: backend
  partOf: 3d
  owner: 3d
  prometheus:
    enabled: true

enabled: true
replicaCount: 1
revisionHistoryLimit: 5  # Amount of revisions we keep
nodePort: 30030  # for minikube deployment only
resetOnConfigChange: false

nameOverride: ""
fullnameOverride: ""

configManagement:
  offlineMode: true
  name: '3d-ops-trigger'
  version: 'latest'
  serverUrl: 'http://localhost:8080/api'

livenessProbe:
  enabled: true
  initialDelaySeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6
  path: /liveness

readinessProbe:
  enabled: true
  initialDelaySeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6
  path: /liveness

podAnnotations: {}

extraVolumes: []

extraVolumeMounts: []

extraEnvVars: []

command: []
args: []
# command: [ "/bin/sh", "-c", "--" ]
# args: [ "while true; do sleep infinity; done;" ]

sidecars: []

cloudProvider:
  dockerRegistryUrl: ''
  imagePullSecretName: ''
  flavor: openshift

caSecretName: ''
caPath: '/usr/local/share/ca-certificates'
caKey: 'ca.crt'

image:
  repository: 3d-ops-trigger
  # If commented, appVersion will be taken. See: _helpers.tpl
  # tag: 'latest'
  pullPolicy: IfNotPresent

server:
  port: 8080
  targetPort: 8080
  protocol: TCP
  responseCompressionEnabled: true
  requestPayloadLimit: 1mb

NFS:
  name: ''
  pv_path: ''
  sub_path: ''

validations:
  lookupTables:
    url: ''
    subUrl: ''

env:
  basePath: ''
  catalog:
    url:
  extractable:
    url:

telemetry:
  logger:
    level: info
    prettyPrint: false
    opentelemetryOptions:
      enabled: true
      url: http://localhost:4317
      # Rendered as OTEL_RESOURCE_ATTRIBUTES in "key=value,key=value" format
      # resourceAttributes:
      #   service.namespace: namespace
      #   deployment.environment: dev
  tracing:
    enabled: true
    url: http://localhost:55681/v1/trace

resources:
  enabled: true
  value:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 100m
      memory: 128Mi

route:
  enabled: true
  path: /
  host: ''
  timeout:
    enabled: false  # defaults to 30s by openshift
    duration: 60s  # supported units (us, ms, s, m, h, d)
  rewriteTarget: ''
  tls:
    enabled: true
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
    useCerts: false
    certificate: ''
    key: ''
    caCertificate: ''

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  labels: {}
  path: /
  pathType: Prefix
  extraPaths: []
  hosts: []
  #  - "chart-example.local"
  host: 'localhost'
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local
