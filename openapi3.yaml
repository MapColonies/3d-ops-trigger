openapi: 3.0.1
info:
  title: 3d-ops-trigger
  description: Entry point for 3D operations — validates requests and triggers Jobnik jobs
  version: 1.0.0
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
paths:
  /record:
    post:
      operationId: createRecord
      tags:
        - record
      summary: Start an ingestion process flow
      description: Validates the request (light & fast) and creates a Jobnik ingestion job.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ingestionPayload'
      responses:
        201:
          description: Ingestion job created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/jobResponse'
        400:
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
  /record/{id}:
    delete:
      operationId: deleteRecord
      tags:
        - record
      summary: Start a delete process flow
      description: Validates the record can be deleted and creates a Jobnik delete job.
      parameters:
        - $ref: '#/components/parameters/recordId'
      responses:
        200:
          description: Delete job created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/jobResponse'
        400:
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        404:
          description: Record not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
    patch:
      operationId: updateRecord
      tags:
        - record
      summary: Update metadata for a record
      parameters:
        - $ref: '#/components/parameters/recordId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/updatePayload'
      responses:
        200:
          description: Metadata updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ackResponse'
        400:
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        404:
          description: Record not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
  /record/status/{id}:
    patch:
      operationId: updateRecordStatus
      tags:
        - record
      summary: Update the publish/unpublish status of a record
      parameters:
        - $ref: '#/components/parameters/recordId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/statusPayload'
      responses:
        200:
          description: Status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ackResponse'
        400:
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        404:
          description: Record not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
security:
  - {}
components:
  parameters:
    recordId:
      name: id
      in: path
      required: true
      description: The record identifier
      schema:
        type: string
  schemas:
    error:
      type: object
      required:
        - message
      properties:
        message:
          type: string
    ingestionPayload:
      type: object
      required:
        - modelPath
        - productShapefilePath
        - metadataShapefilePath
        - productName
        - productId
        - productType
        - classification
        - region
      properties:
        modelPath:
          type: string
          description: Path to the model inside the data/ folder - a tileset.json (3D Tiles) or a .3tz file
          example: /shared/models/afula/data/tileset.json
        productShapefilePath:
          type: string
          description: Path to the footprint shapefile (shape/Product.shp)
          example: /shared/models/afula/shape/Product.shp
        metadataShapefilePath:
          type: string
          description: Path to the parts metadata shapefile (shape/ShapeMetadata.shp)
          example: /shared/models/afula/shape/ShapeMetadata.shp
        productName:
          type: string
          maxLength: 120
          description: Pre-filled from the prodName shapefile attribute, user editable
        productId:
          type: string
          description: Deterministic id derived from the prodID attribute and the storage id
        productType:
          type: string
          enum:
            - 3DPhotoRealistic
            - 3DPhotoRealisticBest
            - 3DSemantic
            - 3DSemanticMesh
            - QuantizedMeshDTMBest
            - QuantizedMeshDSMBest
            - 3DPointCloud
        productSubType:
          type: string
        description:
          type: string
        region:
          type: array
          minItems: 1
          items:
            type: string
        classification:
          type: string
          pattern: '^[a-zA-Z0-9]+$'
        keywords:
          type: string
      additionalProperties: false
    updatePayload:
      type: object
      description: Partial metadata fields to update
      additionalProperties: true
    statusPayload:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - PUBLISHED
            - UNPUBLISHED
    jobResponse:
      type: object
      required:
        - jobId
        - status
      properties:
        jobId:
          type: string
        status:
          type: string
    ackResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
